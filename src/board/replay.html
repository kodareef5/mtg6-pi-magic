<!doctype html>
<!--
  A Magic game to replay: game.js beside this page holds every moment's board as
  cardboard-api scenes, for the audience and each seat, and cardboard's own
  scripts draw them here. Written by /magic replay; a game file can also be
  dropped on the page.

  The same page is a seat's, served at /seat/ with the seat's code after the #:
  the table as set and the agreements before play, then the seat's own board
  and the question its pilot is asked, answered from here.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic replay</title>
<style>
:root { --ink: #f4edda; --bg: #061a16; --panel: #0d2a24; --raised: #133d33; --line: #2b4a42; --muted: #a9b8b0; --accent: #d9bf84; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; transition: background .3s; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; padding: 14px; min-height: 100%; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } .board { position: static; } }
.board { position: sticky; top: 14px; }
.stage { background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; max-height: calc(100vh - 28px); margin: 0 auto;
  box-shadow: 0 0 0 1px var(--panel), 0 10px 30px #0008; }
.stage svg { width: 100%; height: 100%; display: block; }
h1 { margin: 0; font: 600 17px Georgia, serif; letter-spacing: .4px; color: var(--accent); }
h2 { margin: 0 0 8px; font: 600 12px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.row:first-child { margin-top: 0; }
button, select { background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 11px; font: inherit; cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
.views { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.views button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
input[type=range] { flex: 1; accent-color: var(--accent); }
.grow { flex: 1; }
.count { color: var(--muted); }
.when { font: 600 15px Georgia, serif; margin-bottom: 6px; }
ul { margin: 0; padding-left: 18px; } li { margin: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: right; padding: 3px 5px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; } th { color: var(--muted); font-weight: normal; }
#now td:first-child, #perseat th { white-space: nowrap; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
#chart { width: 100%; height: 110px; cursor: pointer; display: block; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; } dt { color: var(--muted); } dd { margin: 0; }
.keys { color: var(--muted); font-size: 12px; margin-top: 8px; }
#tip { position: fixed; z-index: 10; width: 300px; pointer-events: none; display: none; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
  padding: 10px; box-shadow: 0 12px 30px #000a; }
#tip img { width: 100%; border-radius: 10px; display: block; margin-bottom: 8px; }
#tip .name { font: 600 15px Georgia, serif; color: var(--accent); }
#tip .type { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
#tip .text { white-space: pre-wrap; font-size: 13px; }
#tip .state { margin-top: 6px; color: var(--accent); font-size: 12px; }
#tip .credit { margin-top: 6px; color: var(--muted); font-size: 11px; }
#open { max-width: 520px; margin: 18vh auto; text-align: center; }
.live { color: #e8a066; font-weight: 600; letter-spacing: 1px; }
#desk { max-width: 900px; margin: 5vh auto; padding: 0 14px; }
#seat h1 { font-size: 19px; }
.question { font: 600 15px Georgia, serif; margin: 10px 0 8px; }
.options { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.options button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: baseline; }
.options button.suggested { border-color: var(--accent); }
.options .n { color: var(--muted); min-width: 1.4em; }
.badge { margin-left: auto; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
.clock { font-variant-numeric: tabular-nums; color: var(--accent); margin-left: auto; }
.clock.low { color: #e8a066; font-weight: 600; }
.note { color: #e8a066; margin-top: 8px; }
.note:empty { display: none; }
.toggle { display: inline-flex; gap: 4px; }
.toggle button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
.field { background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; font: inherit; flex: 1; min-width: 0; }
.agree { border: 1px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
.result { font: 600 16px Georgia, serif; color: var(--accent); margin-top: 10px; }
.mine td { color: var(--accent); }
#seat table td, #seat table th { text-align: left; white-space: normal; }
.label { color: var(--muted); min-width: 64px; }
a { color: var(--accent); }
</style></head><body>
<main id="replay" hidden>
<section class="board"><div class="stage" id="stage"></div></section>
<aside id="side">
<div class="panel">
<h1 id="title"></h1><div class="sub" id="subtitle"></div>
<div class="views" id="views"></div>
</div>
<div class="panel">
<div class="row"><button id="first" title="First (Home)">⏮</button><button id="prev" title="Previous (←)">◀</button><button id="play" title="Play (space)" class="grow">Play</button><button id="next" title="Next (→)">▶</button><button id="last" title="Last (End)">⏭</button></div>
<div class="row"><input type="range" id="scrub" min="0" value="0"></div>
<div class="row"><select id="turns" title="Jump to a turn" class="grow"></select><span class="count" id="count"></span></div>
<div class="keys">← → step · PageUp/PageDown turn · space plays · V perspective · hover a card for its text, click to bring it forward</div>
</div>
<div class="panel"><h2>Life</h2><svg id="chart" preserveAspectRatio="none"></svg></div>
<div class="panel"><div class="when" id="when"></div><ul id="lines"></ul></div>
<div class="panel"><h2>At this moment</h2><table id="now"></table></div>
<div class="panel" id="totals"><h2>Game totals</h2><table id="perseat"></table></div>
<div class="panel" id="facts"><h2>The game</h2><dl id="game"></dl></div>
</aside>
</main>
<div id="desk" hidden></div>
<div class="panel" id="seat" hidden>
<h1 id="seat-name"></h1><div class="sub" id="seat-sub"></div>
<div id="seat-result"></div>
<div id="seat-agree"></div>
<div id="seat-question"></div>
<div id="seat-play" hidden>
<div class="row"><span class="label">Pilot</span><span class="toggle" id="seat-mode"></span></div>
<div class="row"><span class="label">Stops</span><span class="toggle" id="seat-stops"></span></div>
<form class="row" id="seat-tell"><input class="field" id="seat-words" maxlength="1000" placeholder="Tell your AI how to play this turn"><button>Tell</button></form>
<div class="row"><span class="count grow" id="seat-plan"></span><button id="seat-concede">Concede</button></div>
</div>
<div id="seat-mine" hidden></div>
<div class="note" id="seat-note"></div>
<div id="seat-config"></div>
<datalist id="chat-models"></datalist><datalist id="classifier-models"></datalist>
</div>
<div id="open" class="panel" hidden><h1>Magic replay</h1><p>Open a game file written by <code>/magic replay</code>, or drop one here.</p><input type="file" id="file" accept=".js,.json"></div>
<div id="tip"></div>
<script src="cardboard/engine.js"></script>
<script src="cardboard/extras.js"></script>
<script src="cardboard/perspective.js"></script>
<script src="cardboard/layout.js"></script>
<script src="cardboard/scryfall.js"></script>
<script src="cardboard/renderer.js"></script>
<script src="cardboard/mtg-layout.js"></script>
<script src="cardboard/mtg-renderer.js"></script>
<script src="game.js"></script>
<script>
const T = window.Tabletop, $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (cls) node.className = cls; return node; };

function start(G) {
  $("open").hidden = true; $("replay").hidden = false;
  const moments = G.moments, views = G.perspectives;
  const assets = new Map(Object.entries(G.art)), deck = { id: "board", name: "Board", cards: G.deck }, byId = new Map(G.deck.map((one) => [one.id, one]));
  let at = 0, seen = 0, timer = null, focus = null, turnStarts = [];
  $("title").textContent = G.title; $("subtitle").textContent = G.subtitle; document.title = (G.live ? "Live · " : "") + G.title;
  if (G.live) $("subtitle").prepend(Object.assign(el("span", "● LIVE  ", "live"), { title: "Moments arrive as the game is played. Hands stay hidden until it is over." }));
  // Turn starts and the controls that follow the moments, again whenever a live game adds some.
  function reindex() {
    turnStarts = []; moments.forEach((one, i) => { if (!turnStarts.length || turnStarts.at(-1).turn !== one.turn) turnStarts.push({ turn: one.turn, at: i }); });
    $("turns").replaceChildren(...turnStarts.map((one) => Object.assign(el("option", one.turn ? "Turn " + one.turn : "Opening hands"), { value: String(one.at) })));
    $("scrub").max = String(moments.length - 1);
  }
  views.forEach((view, i) => { const button = el("button", view.label); button.onclick = () => look(i); $("views").append(button); });
  const swatch = (i) => { const dot = el("span", undefined, "dot"); dot.style.background = G.colors[i % G.colors.length]; return dot; };
  const named = (i) => { const span = el("span"); span.append(swatch(i), G.seats[i]); return span; };
  function table(target, head, rows) {
    target.replaceChildren(); const tr = el("tr"); head.forEach((cell) => tr.append(el("th", cell))); target.append(tr);
    for (const row of rows) { const line = el("tr"); row.forEach((cell) => { const td = el("td"); if (cell instanceof Node) td.append(cell); else td.textContent = String(cell); line.append(td); }); target.append(line); }
  }

  // The board itself: this moment's scene for this viewer, drawn by cardboard. Images the scenes share are named, not repeated.
  const image = (value) => value?.startsWith("@") ? G.images[value.slice(1)] : value;
  function scene() {
    const one = structuredClone(moments[at].views[seen].scene);
    one.decks = [deck]; one.activeDeckId = "board";
    for (const player of one.players) if (player.avatarUrl) player.avatarUrl = image(player.avatarUrl);
    if (one.view.mtg.backgroundUrl) one.view.mtg.backgroundUrl = image(one.view.mtg.backgroundUrl);
    // A seat's page marks the cards its question names, on the newest board only, and only cards that board shows.
    const shown = (place) => one.players.find((player) => player.id === place.playerId)?.zones.find((zone) => zone.id === place.zoneId)?.cardIds.length > place.index;
    const marks = (G.marks?.(at === moments.length - 1) ?? []).filter((mark) => shown(mark.target));
    one.extras = { ...one.extras, focus, highlights: [...(one.extras.highlights ?? []), ...marks] };
    return one;
  }
  const draw = () => { $("stage").innerHTML = T.renderDetailed(T.normalize(scene()), { assets }).svg; };

  const place = (card) => ({ playerId: card.getAttribute("data-player"), zoneId: card.getAttribute("data-zone"), index: Number(card.getAttribute("data-card-index")) });
  // A card's printed text and its state now, beside the pointer.
  function tip(event) {
    const card = event.target.closest?.("[data-card-id]"), box = $("tip");
    if (!card || focus) { box.style.display = "none"; return; }
    const id = card.getAttribute("data-card-id"), info = G.cards[id], definition = byId.get(id);
    if (!info) { box.style.display = "none"; return; }
    const ref = { playerId: card.getAttribute("data-player"), zoneId: card.getAttribute("data-zone"), index: Number(card.getAttribute("data-card-index")) };
    const marks = moments[at].views[seen].scene.extras.cards.find((one) => one.target.playerId === ref.playerId && one.target.zoneId === ref.zoneId && one.target.index === ref.index);
    const art = definition?.scryfallId ? assets.get(T.scryfallAssetKey(definition)) : undefined;
    box.replaceChildren(...[art?.image && Object.assign(el("img"), { src: art.image }), el("div", info.name + (info.cost ? "  " + info.cost : ""), "name"),
      info.type && el("div", info.type + (info.stats ? " · " + info.stats : ""), "type"), info.text && el("div", info.text, "text"),
      marks && el("div", [marks.tapped ? "Tapped" : "", marks.badge ?? "", ...(marks.tags ?? []), ...(marks.counters ?? []).map((one) => one.count + " " + one.name)].filter(Boolean).join(" · "), "state"),
      art?.artist && el("div", "Illustrated by " + art.artist + " · Scryfall", "credit")].filter(Boolean));
    box.style.display = "block";
    const wide = box.offsetWidth, high = box.offsetHeight;
    box.style.left = Math.min(event.clientX + 18, innerWidth - wide - 8) + "px";
    box.style.top = Math.max(8, Math.min(event.clientY - high / 2, innerHeight - high - 8)) + "px";
  }
  $("stage").addEventListener("mousemove", tip);
  $("stage").addEventListener("mouseleave", () => { $("tip").style.display = "none"; });
  // Click a card to bring it forward; click again, or Escape, to put it back.
  $("stage").addEventListener("click", (event) => {
    const card = event.target.closest?.("[data-card-id]");
    if (card && G.picked?.(place(card))) { $("tip").style.display = "none"; return; }
    focus = focus || !card ? null : { target: { playerId: card.getAttribute("data-player"), zoneId: card.getAttribute("data-zone"), index: Number(card.getAttribute("data-card-index")) }, layout: "spotlight" };
    $("tip").style.display = "none"; draw();
  });

  // Life over the game, one line per seat; the marker is this moment.
  function chart() {
    const lives = moments.map((one) => one.counts.map((seat) => seat[0])), high = Math.max(20, ...lives.flat()), low = Math.min(0, ...lives.flat()), total = moments.length;
    const w = 1000, h = 110, x = (i) => total > 1 ? i / (total - 1) * w : 0, y = (life) => h - 6 - (life - low) / (high - low || 1) * (h - 12);
    let out = '<line x1="0" x2="' + w + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)"/>';
    for (const t of turnStarts) out += '<line x1="' + x(t.at) + '" x2="' + x(t.at) + '" y1="0" y2="' + h + '" stroke="var(--raised)"/>';
    G.seats.forEach((_, s) => { out += '<polyline fill="none" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke="' + G.colors[s % G.colors.length] + '" points="' + lives.map((one, i) => x(i) + "," + y(one[s])).join(" ") + '"/>'; });
    out += '<line x1="' + x(at) + '" x2="' + x(at) + '" y1="0" y2="' + h + '" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
    $("chart").setAttribute("viewBox", "0 0 " + w + " " + h); $("chart").innerHTML = out;
  }
  $("chart").addEventListener("click", (event) => { const box = $("chart").getBoundingClientRect(); show(Math.round((event.clientX - box.left) / box.width * (moments.length - 1))); });

  const turnOf = () => turnStarts.findLastIndex((t) => t.at <= at);
  function show(next) {
    at = Math.max(0, Math.min(moments.length - 1, next)); focus = null;
    const one = moments[at];
    if (!one) { $("when").textContent = "Waiting for the first moment."; return; }
    draw();
    $("when").textContent = one.when; $("lines").replaceChildren(...one.views[seen].lines.map((line) => el("li", line)));
    table($("now"), ["", "Life", "Hand", "Library", "Board", "Grave", "Exile"], one.counts.map((seat, i) => [named(i), ...seat]));
    $("scrub").value = String(at); $("count").textContent = (at + 1) + " / " + moments.length; $("turns").value = String(turnStarts[turnOf()]?.at ?? 0);
    chart();
    // A seat's page keeps its code after the #, so it never writes there.
    if (!G.seat) location.replace("#" + (at + 1) + "/" + views[seen].key);
  }
  // A perspective is the board that viewer saw, what it saw happen, and the colours of its board.
  function look(i) {
    seen = (i + views.length) % views.length;
    for (const [name, value] of Object.entries(views[seen].theme)) document.documentElement.style.setProperty("--" + name, value);
    [...$("views").children].forEach((button, b) => button.setAttribute("aria-pressed", String(b === seen)));
    show(at);
  }
  // Back goes to the start of this turn first, as a music player's back does.
  const turnJump = (step) => { const here = turnOf(), to = step < 0 && turnStarts[here].at < at ? here : here + step; show(turnStarts[Math.max(0, Math.min(turnStarts.length - 1, to))].at); };
  function play(on) { clearInterval(timer); timer = on ? setInterval(() => { if (at >= moments.length - 1) { if (!G.live) play(false); } else show(at + 1); }, 1500) : null; $("play").textContent = on ? "Pause" : "Play"; }
  $("first").onclick = () => show(0); $("last").onclick = () => show(moments.length - 1); $("prev").onclick = () => show(at - 1); $("next").onclick = () => show(at + 1);
  $("play").onclick = () => play(!timer); $("scrub").oninput = (event) => show(Number(event.target.value)); $("turns").onchange = (event) => show(Number(event.target.value));
  document.addEventListener("keydown", (event) => {
    if (event.target.tagName === "SELECT" || event.target.classList?.contains("field") || event.target.tagName === "INPUT" && event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    const keys = { ArrowRight: () => show(at + 1), ArrowLeft: () => show(at - 1), Home: () => show(0), End: () => show(moments.length - 1), PageDown: () => turnJump(1), PageUp: () => turnJump(-1),
      " ": () => play(!timer), v: () => look(seen + 1), V: () => look(seen - 1), Escape: () => { if (focus) { focus = null; draw(); } } };
    if (keys[event.key]) { event.preventDefault(); keys[event.key](); }
  });

  if (G.stats) {
    const names = G.stats.seats[0]?.counts.map((one) => one[0]) ?? [];
    table($("perseat"), ["", ...G.stats.seats.map((seat) => seat.name)],
      [["Deck", ...G.stats.seats.map((seat) => seat.deck)], ...(G.stats.seats.some((seat) => seat.result) ? [["Result", ...G.stats.seats.map((seat) => seat.result ?? "")]] : []),
        ...names.map((name, row) => [name, ...G.stats.seats.map((seat) => seat.counts[row][1])])]);
    $("perseat").querySelectorAll("tr:first-child th").forEach((th, i) => { if (i) th.prepend(swatch(i - 1)); });
    $("game").replaceChildren(...G.stats.game.flatMap(([label, value]) => [el("dt", label), el("dd", value)]));
  } else { $("totals").remove(); $("facts").remove(); }
  reindex();
  const [moment, key] = G.seat ? [] : location.hash.slice(1).split("/");
  at = G.live && !moment ? moments.length - 1 : Math.max(0, Math.min(moments.length - 1, Number(moment) - 1 || 0));
  look(Math.max(0, views.findIndex((view) => view.key === key)));

  // What is new in a live game. Watching the newest moment follows play; stepping back stays put.
  function apply(update) {
    const following = at >= moments.length - 1;
    G.version = update.version;
    for (const [name, value] of update.images) G.images[name] = value;
    for (const one of update.deck) { G.deck.push(one); byId.set(one.id, one); }
    Object.assign(G.cards, update.cards);
    for (const [name, value] of Object.entries(update.art)) assets.set(name, value);
    moments.splice(update.from, Infinity, ...update.moments);
    reindex();
    show(following ? moments.length - 1 : at);
  }
  // A live game asks what is new, held by the server until there is some. When the game is over, the page loads
  // again, with every perspective once it has a result. A seat's page asks through its seat instead.
  if (G.live && !G.seat) (async () => {
    for (;;) {
      try {
        const query = "version=" + G.version + "&moments=" + moments.length + "&deck=" + G.deck.length + "&images=" + Object.keys(G.images).length;
        const update = await (await fetch("live.json?" + query, { cache: "no-store" })).json();
        if (update.finished) { location.reload(); return; }
        apply(update);
      } catch { await new Promise((wait) => setTimeout(wait, 2000)); }
    }
  })();
  return { apply, redraw: () => { if (moments[at]) draw(); }, place };
}

// A seat's page. The code after the # is the seat's: sent as a bearer token, never in an address.
function seat() {
  const code = location.hash.slice(1), auth = { authorization: "Bearer " + code }, wait = (ms) => new Promise((go) => setTimeout(go, ms));
  const closed = (message) => { $("seat").hidden = true; $("replay").hidden = true; $("open").hidden = false; $("open").replaceChildren(el("h1", "Magic seat"), el("p", message)); };
  if (!code) return closed("This page opens a seat from its link, with the seat's code after the #. Ask the host for it.");
  $("desk").hidden = false; $("seat").hidden = false; $("desk").append($("seat"));
  let state = null, deadline = null, G = null, board = null, shownAsk = null, narrowed = null;
  // A card on the board, by where it sits; the question's options name the cards they use the same way.
  const spot = (place) => place.playerId + "/" + place.zoneId + "/" + place.index;
  const touching = (asked, key) => asked.options.flatMap((one, i) => (one.at ?? []).some((place) => spot(place) === key) ? [i] : []);
  const note = (text) => { $("seat-note").textContent = text || ""; };
  async function send(body) {
    try {
      const said = await (await fetch("../api/seat", { method: "POST", headers: { ...auth, "content-type": "application/json" }, body: JSON.stringify(body) })).json();
      note(said.ok ? "" : said.message);
      return said.ok;
    } catch { note("The host did not answer. Try again."); return false; }
  }
  const button = (text, act, title) => { const one = el("button", text); one.type = "button"; if (title) one.title = title; one.onclick = act; return one; };
  const toggle = (target, values, now, act) => target.replaceChildren(...values.map(([value, label]) => { const one = button(label, () => act(value)); one.setAttribute("aria-pressed", String(value === now)); return one; }));

  // The pilot's own controls, made once so a field keeps what is being typed while the table moves.
  $("seat-tell").onsubmit = async (event) => { event.preventDefault(); const words = $("seat-words").value.trim(); if (words && await send({ do: "tell", words })) { $("seat-words").value = ""; note("Your AI plans from that at the seat's next question."); } };
  $("seat-concede").onclick = () => { if (confirm("Concede this game?")) send({ do: "concede" }); };
  const roles = [["decide", "Picks", "classifier-models"], ["pregame", "Pregame", "chat-models"], ["strategy", "Strategy", "chat-models"]];
  const fields = Object.fromEntries(roles.map(([role, , list]) => [role, Object.assign(el("input"), { className: "field", placeholder: "provider/model[:thinking]" })]));
  roles.forEach(([role, , list]) => fields[role].setAttribute("list", list));
  const keyField = Object.assign(el("input"), { className: "field", type: "password", placeholder: "Your OpenRouter key, sk-or-…", autocomplete: "off" });
  $("seat-mine").append(el("h2", "Your seat"),
    ...roles.map(([role, label]) => { const row = el("form", undefined, "row"); row.onsubmit = (event) => { event.preventDefault(); if (fields[role].value.trim()) send({ do: "model", role, pattern: fields[role].value.trim() }).then((ok) => { if (ok) fields[role].value = ""; }); };
      row.append(el("span", label, "label"), fields[role], el("button", "Choose"), button("Default", () => send({ do: "model", role, pattern: "default" }))); return row; }),
    (() => { const row = el("form", undefined, "row"); row.onsubmit = (event) => { event.preventDefault(); send({ do: "key", key: keyField.value }).then((ok) => { if (ok) keyField.value = ""; }); };
      row.append(el("span", "Key", "label"), keyField, el("button", "Use my key"), button("Game's key", () => send({ do: "key", key: null }))); return row; })(),
    el("div", "Models are named as at Pi's /model: provider/id, with :low, :medium or :high for thinking. Your key is held in the host's memory for this table, and never written down.", "keys"));

  function render(now) {
    state = now;
    const asked = now.question, playing = !!now.mode, setting = now.stage === "setting";
    $("seat-name").textContent = "Seat " + now.seat + " · " + now.name;
    $("seat-sub").textContent = [now.game, now.stage + (now.paused ? ", paused by the host" : ""), now.judge ? "a judge hears objections" : "", now.clock ? now.clock + "s a decision" : "no clock"].filter(Boolean).join(" · ");
    document.title = (asked ? "● " : "") + "Seat " + now.seat + " · " + now.name;
    if (now.stage === "over") document.querySelector("#subtitle .live")?.remove();
    // The result, and the whole game to replay once it has one.
    $("seat-result").replaceChildren(...(now.result ? [el("div", now.result === "win" ? "You won." : now.result === "lose" ? "You lost." : "A draw.", "result"),
      ...(now.replay ? [Object.assign(el("a", "Every seat's view of the game"), { href: now.replay, target: "_blank" })] : [])] : []));
    // An agreement the host asks of this seat: to the table as set, shown below.
    $("seat-agree").replaceChildren(...(now.agreement ? [(() => { const box = el("div", undefined, "agree");
      box.append(el("div", now.agreement === "prepare" ? "The host asks every seat to prepare, with the table as set below. Nothing is dealt yet." : "The host asks every seat to begin: the hands are dealt and the mulligans start."),
        (() => { const row = el("div", undefined, "row"); row.append(button(now.agreement === "prepare" ? "Agree" : "Begin", () => send({ do: "agree", what: now.agreement, yes: true })), button("Decline", () => send({ do: "agree", what: now.agreement, yes: false }))); return row; })());
      return box; })()] : []));
    // The question, its options folded as the seat's menu, and the AI's pick.
    if (asked?.ask !== shownAsk) { shownAsk = asked?.ask ?? null; narrowed = null; if (asked) note(""); }
    const only = asked && narrowed ? touching(asked, narrowed) : null;
    deadline = now.remaining !== undefined ? Date.now() + now.remaining : null;
    $("seat-question").replaceChildren(...(asked ? [
      (() => { const row = el("div", undefined, "row"); row.append(el("span", asked.options.some((one) => one.suggested) ? "Your AI suggests a choice." : "Your choice.", "count"), el("span", "", "clock")); return row; })(),
      el("div", asked.text, "question"), ...(asked.refused ? [el("div", "Refused: " + asked.refused, "note")] : []),
      ...(only ? [(() => { const row = el("div", undefined, "row"); row.append(el("span", "The options that use that card.", "count grow"), button("Every option", () => { narrowed = null; render(state); })); return row; })()] : []),
      (() => { const list = el("ol", undefined, "options"); asked.options.forEach((one, i) => { if (only && !only.includes(i)) return; const item = el("li"), choice = button("", () => send({ do: "choose", ask: asked.ask, n: i + 1 }), one.shows);
        choice.append(el("span", (i + 1) + ".", "n"), el("span", one.label), ...(one.suggested ? [el("span", "AI", "badge")] : [])); if (one.suggested) choice.classList.add("suggested"); item.append(choice); list.append(item); }); return list; })(),
      (() => { const row = el("div", undefined, "row"); row.append(...(asked.options.some((one) => one.suggested) ? [button("OK: the AI's pick", () => send({ do: "accept", ask: asked.ask }), "Enter")] : []),
        ...(asked.pass ? [button("Pass", () => send({ do: "pass", ask: asked.ask, rest: "now" }), "P"), button("Pass the turn", () => send({ do: "pass", ask: asked.ask, rest: "turn" }), "Pass the rest of this turn unless another seat puts something on the stack")] : [])); return row; })(),
    ] : playing && !now.result ? [el("div", now.mode === "auto" ? "Your seat's AI is playing it. Suggest or manual takes it back." : "Waiting for the table.", "count")] : []));
    tick();
    board?.redraw();
    // The pilot's controls while the game plays.
    $("seat-play").hidden = !playing || !!now.result;
    if (playing) {
      toggle($("seat-mode"), [["suggest", "Suggest"], ["auto", "AI plays"], ["manual", "Manual"]], now.mode, (mode) => send({ do: "mode", mode }));
      toggle($("seat-stops"), [["smart", "Smart"], ["all", "Every priority"]], now.stops, (stops) => send({ do: "stops", stops }));
      $("seat-plan").textContent = now.plan ? "Plan: " + now.plan : "";
    }
    // The table as set, which every seat agrees to; this seat's own choices while it is set.
    $("seat-config").replaceChildren(...(playing ? [] : [el("h2", "The table"), (() => { const box = el("table");
      table(box, ["Seat", "Deck", "Pilot", "Picks", "Pregame", "Strategy", "Key"], now.seats.map((one) => [String(one.seat), one.deck, one.pilot, one.models.decide, one.models.pregame, one.models.strategy, one.key]));
      [...box.querySelectorAll("tr")].slice(1).forEach((row, i) => { if (now.seats[i].seat === now.seat) row.className = "mine"; }); return box; })()]));
    $("seat-mine").hidden = !(setting || now.key === "missing" && !playing);
    roles.forEach(([role]) => { fields[role].disabled = !setting; });
    if (now.choices) { $("chat-models").replaceChildren(...now.choices.chat.map((id) => Object.assign(el("option"), { value: id }))); $("classifier-models").replaceChildren(...now.choices.classifiers.map((id) => Object.assign(el("option"), { value: id }))); }
    keyField.placeholder = now.key === "given" ? "Your key is given; another replaces it" : now.key === "missing" ? "This seat pays with your OpenRouter key: give it here" : "Your OpenRouter key, sk-or-…";
  }
  function table(target, head, rows) {
    target.replaceChildren(); const tr = el("tr"); head.forEach((cell) => tr.append(el("th", cell))); target.append(tr);
    for (const row of rows) { const line = el("tr"); row.forEach((cell) => line.append(el("td", cell))); target.append(line); }
  }
  // The clock counts down here between states; the host keeps the time that counts.
  function tick() {
    const clock = $("seat-question").querySelector(".clock");
    if (!clock) return;
    const left = deadline === null ? null : Math.max(0, Math.round((deadline - Date.now()) / 1000));
    clock.textContent = left === null ? "" : Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
    clock.classList.toggle("low", left !== null && left <= 20);
  }
  setInterval(tick, 500);
  document.addEventListener("keydown", (event) => {
    const asked = state?.question;
    if (!asked || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.metaKey || event.ctrlKey || event.altKey) return;
    if (/^[1-9]$/.test(event.key) && Number(event.key) <= asked.options.length) { event.preventDefault(); send({ do: "choose", ask: asked.ask, n: Number(event.key) }); }
    else if (event.key === "Enter" && event.target.tagName !== "BUTTON" && asked.options.some((one) => one.suggested)) { event.preventDefault(); send({ do: "accept", ask: asked.ask }); }
    else if (event.key === "p" && asked.pass) { event.preventDefault(); send({ do: "pass", ask: asked.ask, rest: "now" }); }
  });

  // The seat's state and board, each asked again as soon as it is answered: the host holds the question until something is new.
  (async () => {
    let serial = -1;
    for (;;) {
      let got, reply;
      try {
        const query = new URLSearchParams({ after: String(serial), ...(G ? { game: G.game, version: String(G.version), moments: String(G.moments.length), deck: String(G.deck.length), images: String(Object.keys(G.images).length) } : {}) });
        reply = await fetch("../api/seat?" + query, { headers: auth, cache: "no-store" });
        got = await reply.json();
      } catch { await wait(2000); continue; }
      if (reply.status === 401) return closed(got.message);
      serial = got.serial;
      if (got.board?.full) {
        if (G) { location.reload(); return; }
        G = { ...got.board.full, game: got.board.game };
        // Cards the question can use glow; the one chosen to narrow it glows warmer.
        G.marks = (latest) => {
          const asked = state?.question, seen = new Map();
          if (!latest || !asked) return [];
          for (const one of asked.options) for (const place of one.at ?? []) seen.set(spot(place), place);
          return [...seen.entries()].map(([key, target]) => ({ target, preset: key === narrowed ? "ember" : "frost" }));
        };
        // A click on a card the question can use shows only its options, and another click shows them all again.
        // Two quick clicks on a card with one option take it. Counted here: each click redraws the board, so the
        // browser sees two different cards and never calls it a double click.
        let last = { key: null, at: 0 };
        G.picked = (place) => {
          const asked = state?.question, key = spot(place), options = asked ? touching(asked, key) : [];
          if (!options.length) return false;
          const twice = last.key === key && Date.now() - last.at < 450;
          last = { key, at: Date.now() };
          if (twice && options.length === 1) { send({ do: "choose", ask: asked.ask, n: options[0] + 1 }); return true; }
          narrowed = narrowed === key && !twice ? null : key;
          render(state);
          return true;
        };
        board = start(G);
        $("desk").hidden = true;
        $("side").prepend($("seat"));
        $("views").hidden = true;
        scrollTo(0, 0);
      } else if (got.board?.since && board) board.apply(got.board.since);
      render(got.state);
    }
  })();
}

// A game file is game.js as /magic replay writes it, or the same object as JSON.
async function load(file) {
  const text = await file.text();
  start(JSON.parse(text.replace(/^\s*window\.GAME\s*=\s*/, "").replace(/;\s*$/, "")));
}
if (window.SEAT) seat();
else if (window.GAME) start(window.GAME);
else {
  $("open").hidden = false;
  if (window.GAME_ERROR) $("open").querySelector("p").textContent = window.GAME_ERROR;
  $("file").onchange = (event) => event.target.files[0] && load(event.target.files[0]);
  document.addEventListener("dragover", (event) => event.preventDefault());
  document.addEventListener("drop", (event) => { event.preventDefault(); if (event.dataTransfer.files[0]) load(event.dataTransfer.files[0]); });
}
</script></body></html>
